# ricotdin v2 on the home server (ARC-15). DRAFT, kept in ricotdin/docs/ops/deployment-repo/; the
# operator copies it to the deployment repository. See that folder's README before applying.
#
# The images come only from release.env, written by ricotdin's release workflow:
#   RICOTDIN_API_IMAGE=mingming21400/ricotdin-api:vX.Y.Z@sha256:<digest>   (API + worker)
#   RICOTDIN_WEB_IMAGE=mingming21400/ricotdin-web:vX.Y.Z@sha256:<digest>
#   RICOTDIN_VERSION=vX.Y.Z
# Deploy: docker compose -p ricotdin-v2 -f apps/ricotdin-v2/compose.yml --env-file apps/ricotdin-v2/release.env up -d --wait
#
# No published ports. cloudflared (on the `web` network) reaches the API as http://ricotdin-api:8000
# and the SPA as http://ricotdin-web:8080: two public hostnames that are sibling subdomains of one
# site (refresh cookie SameSite=Lax, ricotdin CLAUDE.md §0.3). Secrets live ONLY in the server
# env files below, one per container, never in a repository and never the owner DATABASE_URL
# (migrations are a separate owner step: alembic upgrade head, BEFORE merging a release PR).

name: ricotdin-v2

services:
  api:
    image: ${RICOTDIN_API_IMAGE:?RICOTDIN_API_IMAGE is unset - pass --env-file apps/ricotdin-v2/release.env}
    restart: unless-stopped
    # DATABASE_URL_APP, DATABASE_URL_SERVICE, DATABASE_URL_WORKER (the /media lookup),
    # JWT_PRIVATE_KEY, KEY_ENCRYPTION_SECRET, SMTP_*, MAIL_FROM, WEB_ORIGIN, ALLOWED_ORIGINS,
    # FORWARDED_ALLOW_IPS (the `web` network subnet, docker network inspect web), SENTRY_DSN,
    # optional provider key fallbacks. Never API_DOCS=1 in production.
    env_file: [/etc/mmlabs/ricotdin-api.env]
    environment:
      RICOTDIN_VERSION: ${RICOTDIN_VERSION:-}
    # image HEALTHCHECK: GET /health (no database)
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels: [autoheal=true]
    networks:
      tunnel:
        aliases: [ricotdin-api]
      default: {}

  worker:
    image: ${RICOTDIN_API_IMAGE:?RICOTDIN_API_IMAGE is unset}
    command: ['python', '-m', 'app.worker']
    restart: unless-stopped
    # ONLY DATABASE_URL_WORKER, KEY_ENCRYPTION_SECRET, optional provider key fallbacks,
    # LOG_LEVEL, SENTRY_DSN: the worker refuses to start with any other database URL or secret.
    env_file: [/etc/mmlabs/ricotdin-worker.env]
    environment:
      RICOTDIN_VERSION: ${RICOTDIN_VERSION:-}
      TMPDIR: /work # job directories + heartbeat (app.worker.health)
    stop_grace_period: 30s # SIGTERM: stop claiming, release a running step after 8 s
    read_only: true
    volumes:
      # Per-job work directories (recordings up to 1 GiB, 6 h). A disk volume, not tmpfs (RAM).
      - worker-work:/work
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.worker.health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels: [autoheal=true]
    networks: [default] # outbound only: Postgres, Google Drive, AI / speech providers

  web:
    image: ${RICOTDIN_WEB_IMAGE:?RICOTDIN_WEB_IMAGE is unset}
    restart: unless-stopped
    # RICOTDIN_API_URL (required, e.g. https://api.<domain>) and optional RICOTDIN_AUTH_URL:
    # plain origins, not secrets. The container exits on anything else.
    env_file: [/etc/mmlabs/ricotdin-web.env]
    # image HEALTHCHECK: GET /healthz
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels: [autoheal=true]
    networks:
      tunnel:
        aliases: [ricotdin-web]

  # Plain compose never restarts an UNHEALTHY container (only an exited one). autoheal restarts
  # the ones labelled autoheal=true in this project. It needs the Docker socket: pinned by digest.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: '30'
      AUTOHEAL_START_PERIOD: '120'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

volumes:
  worker-work: {}

networks:
  tunnel:
    external: true
    # The network cloudflared is on — `web`, created by proxy/compose.yml.
    name: web
