# ricotdin v2 STAGING on the self-hosted runner macbook-runner (mmlabs-server is retired) (OPS-02). DRAFT, kept in ricotdin/docs/ops/deployment-repo/;
# the operator copies it to the deployment repository. A copy of apps/ricotdin-v2/compose.yml with its
# own project, network aliases, env files and autoheal label, so it runs next to production and v1.
#
# The images come only from release.env, written by ricotdin's release-staging.yml:
#   RICOTDIN_API_IMAGE=mingming21400/ricotdin-api:staging-X.Y.Z-<sha7>@sha256:<digest>   (API + worker)
#   RICOTDIN_WEB_IMAGE=mingming21400/ricotdin-web:staging-X.Y.Z-<sha7>@sha256:<digest>
#   RICOTDIN_VERSION=staging-X.Y.Z-<sha7>
# Deploy: docker compose -p ricotdin-v2-staging -f apps/ricotdin-v2-staging/compose.yml --env-file apps/ricotdin-v2-staging/release.env up -d --wait
#
# No published ports. cloudflared (on the `web` network) reaches the API as
# http://ricotdin-staging-api:8000 (https://ricotdin-staging-api.mmlabs.online) and the SPA as
# http://ricotdin-staging-web:8080 (https://ricotdin-staging.mmlabs.online). Staging uses the shared
# Postgres (postgres/, database `ricotdin`, as postgres:5432 on the internal `db` network, no TLS)
# through the three app logins only (never the owner DATABASE_URL) and has no SMTP_*
# (nobody can register). Its worker shares the job queue with any worker the owner runs locally.

name: ricotdin-v2-staging

services:
  api:
    image: ${RICOTDIN_API_IMAGE:?RICOTDIN_API_IMAGE is unset - pass --env-file apps/ricotdin-v2-staging/release.env}
    restart: unless-stopped
    # DATABASE_URL_APP, DATABASE_URL_SERVICE, DATABASE_URL_WORKER (the /media lookup),
    # JWT_PRIVATE_KEY, KEY_ENCRYPTION_SECRET, SMTP_*, MAIL_FROM, WEB_ORIGIN, ALLOWED_ORIGINS,
    # FORWARDED_ALLOW_IPS (ONLY cloudflared's fixed address, never the shared `web` subnet), SENTRY_DSN,
    # optional provider key fallbacks. API_DOCS=1 is acceptable on staging only. No SMTP_* on staging.
    env_file: [/Users/mingming/.config/ricotdin-staging/api.env]
    environment:
      RICOTDIN_VERSION: ${RICOTDIN_VERSION:-}
    # image HEALTHCHECK: GET /health (no database)
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    labels: [autoheal-ricotdin-staging=true]
    networks:
      tunnel:
        aliases: [ricotdin-staging-api]
      db: {} # postgres:5432

  worker:
    image: ${RICOTDIN_API_IMAGE:?RICOTDIN_API_IMAGE is unset}
    command: ['python', '-m', 'app.worker']
    restart: unless-stopped
    # ONLY DATABASE_URL_WORKER, KEY_ENCRYPTION_SECRET, optional provider key fallbacks,
    # LOG_LEVEL, SENTRY_DSN: the worker refuses to start with any other database URL or secret.
    env_file: [/Users/mingming/.config/ricotdin-staging/worker.env]
    environment:
      RICOTDIN_VERSION: ${RICOTDIN_VERSION:-}
      TMPDIR: /work # job directories + heartbeat (app.worker.health)
    stop_grace_period: 30s # SIGTERM: stop claiming, release a running step after 8 s
    read_only: true
    volumes:
      # Per-job work directories (recordings up to 1 GiB, 6 h). A disk volume, not tmpfs (RAM).
      - worker-work:/work
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.worker.health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels: [autoheal-ricotdin-staging=true]
    networks: [default, db] # default: outbound (Google Drive, AI / speech providers); db: postgres:5432

  web:
    image: ${RICOTDIN_WEB_IMAGE:?RICOTDIN_WEB_IMAGE is unset}
    restart: unless-stopped
    # RICOTDIN_API_URL=https://ricotdin-staging-api.mmlabs.online (required) and optional RICOTDIN_AUTH_URL:
    # plain origins, not secrets. The container exits on anything else.
    env_file: [/Users/mingming/.config/ricotdin-staging/web.env]
    # image HEALTHCHECK: GET /healthz
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    labels: [autoheal-ricotdin-staging=true]
    networks:
      tunnel:
        aliases: [ricotdin-staging-web]

  # Plain compose never restarts an UNHEALTHY container (only an exited one). This autoheal
  # restarts only containers labelled autoheal-ricotdin-staging=true (production has its own). The Docker socket is host root: pinned by
  # digest, no network (follow-up: a socket proxy allowing only list + restart).
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal-ricotdin-staging # only this project
      AUTOHEAL_INTERVAL: '30'
      AUTOHEAL_START_PERIOD: '120'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

volumes:
  worker-work: {}

networks:
  tunnel:
    external: true
    # The network cloudflared is on — `web`, created by proxy/compose.yml.
    name: web
  db:
    external: true
    # The shared Postgres network (internal, no internet), created by deploy-postgres.
    name: db
  default: {}
