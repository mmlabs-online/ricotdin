name: deploy-ricotdin-v2

# ricotdin v2, the only ricotdin (v1 and the v2 staging environment are retired, ARC-20). A merge to
# main that touches apps/ricotdin-v2/ deploys it (api + worker + web + its own autoheal) on the
# self-hosted runner macbook-runner: pull both images pinned in release.env, start them, wait until
# every container is healthy. If not, restore apps/ricotdin-v2/ as it was before the push, redeploy
# that, and push the revert. workflow_dispatch redeploys what main pins.
#
# The release PRs come from ricotdin's release.yml (tag vX.Y.Z on release/X.Y, branch
# release/ricotdin-v2-vX.Y.Z); the owner reviews and merges them.
# Runtime secrets are repository secrets of the deployment repo, one per key, named RICOTDIN_<KEY>,
# except the mail login: ORG_ADMIN_SMTP_USERNAME / _PASSWORD of the environment org-admin-api
# (step `envfile`). Each run rewrites the three env files below from them (chmod 600), so nobody
# creates or edits those files by hand: change a secret, then Run workflow. Values are never printed.
# No migrate step: run the release's `alembic upgrade head` on the Mac BEFORE merging its PR
# (ricotdin docs/ops/self-hosted-postgres.md). A restore never touches the database, so every
# migration must stay compatible with the previous release's image.

on:
  push:
    branches: [main]
    paths: ['apps/ricotdin-v2/**']
  workflow_dispatch:

permissions:
  contents: write # the revert push after a restore
  pull-requests: write # the outcome comment on the merged release PR

concurrency:
  group: deploy-ricotdin-v2
  cancel-in-progress: false

env:
  APP_DIR: apps/ricotdin-v2
  PROJECT: ricotdin-v2
  # Must match env_file in apps/ricotdin-v2/compose.yml. Written by step `envfile` (chmod 600).
  RICOTDIN_ENV_DIR: /Users/mingming/.config/ricotdin

jobs:
  deploy:
    runs-on: [self-hosted, macbook-runner]
    # Reuses org-admin-api's Gmail account for registration / password-reset mail: its App
    # Password lives in the GitHub Environment `org-admin-api` (ORG_ADMIN_SMTP_USERNAME /
    # ORG_ADMIN_SMTP_PASSWORD), which only a job declaring that environment can read.
    environment: org-admin-api
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: release
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if grep -n 'TODO-operator' "$APP_DIR/compose.yml"; then
            echo "::error::$APP_DIR/compose.yml still holds a TODO-operator placeholder. Replace it before deploying. Nothing was started."
            exit 1
          fi
          if [ ! -f "$APP_DIR/release.env" ]; then
            echo "::notice::No $APP_DIR/release.env yet: nothing has been released. Nothing was deployed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # release.env holds the three pins and comments, nothing else (compose --env-file would
          # honour any other key, e.g. COMPOSE_*). Both images: same tag, by digest, v2 repos only.
          check_release_env() {
            local file="$1" version api webimg pair name value pattern
            if grep -vqE '^(#.*|RICOTDIN_API_IMAGE=.*|RICOTDIN_WEB_IMAGE=.*|RICOTDIN_VERSION=v[2-9][0-9]*\.[0-9]+\.[0-9]+|)$' "$file"; then
              echo "::error::$file holds a line other than the three pins. Nothing was started."
              return 1
            fi
            version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$file")"
            api="$(sed -n 's/^RICOTDIN_API_IMAGE=//p' "$file")"
            webimg="$(sed -n 's/^RICOTDIN_WEB_IMAGE=//p' "$file")"
            for pair in "api:$api" "web:$webimg"; do
              name="${pair%%:*}"; value="${pair#*:}"
              pattern="^mingming21400/ricotdin-$name:v[2-9][0-9]*\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$"
              if [ -z "$version" ] || ! [[ "$value" =~ $pattern ]] || [[ "$value" != "mingming21400/ricotdin-$name:$version@sha256:"* ]]; then
                echo "::error::The $name pin in $file is not mingming21400/ricotdin-$name:$version@sha256:<digest>. Nothing was started."
                return 1
              fi
            done
          }
          check_release_env "$APP_DIR/release.env"
          version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$APP_DIR/release.env")"
          image="$version"
          previous=""
          # BEFORE is empty on workflow_dispatch: no previous release, so a failure is not restored.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE:$APP_DIR/release.env" 2>/dev/null; then
            previous="$(git show "$BEFORE:$APP_DIR/release.env" | sed -n 's/^RICOTDIN_VERSION=//p')"
          fi
          {
            echo "skip=false"
            echo "image=$image"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      # Writes api.env / worker.env / web.env from the repository secrets RICOTDIN_<KEY> plus the
      # non-secret production values below. Each service gets only its own keys (the worker refuses to
      # start with any other secret). Values are never printed: no echo, no argv (printf is a shell
      # builtin). Values are written single-quoted, so compose does not interpolate a `$` in them.
      # A missing required secret fails the run by NAME before any file is replaced or any
      # container is touched. Optional keys are left out when empty ("" is not the same as unset).
      - name: envfile
        id: envfile
        if: steps.release.outputs.skip != 'true'
        env:
          DATABASE_URL_APP: ${{ secrets.RICOTDIN_DATABASE_URL_APP }}
          DATABASE_URL_SERVICE: ${{ secrets.RICOTDIN_DATABASE_URL_SERVICE }}
          DATABASE_URL_WORKER: ${{ secrets.RICOTDIN_DATABASE_URL_WORKER }}
          JWT_PRIVATE_KEY: ${{ secrets.RICOTDIN_JWT_PRIVATE_KEY }}
          JWT_PREVIOUS_PUBLIC_KEY: ${{ secrets.RICOTDIN_JWT_PREVIOUS_PUBLIC_KEY }}
          KEY_ENCRYPTION_SECRET: ${{ secrets.RICOTDIN_KEY_ENCRYPTION_SECRET }}
          SENTRY_DSN: ${{ secrets.RICOTDIN_SENTRY_DSN }}
          # Registration + password reset mail through org-admin-api's Gmail account (environment
          # org-admin-api). MAIL_FROM optional (e.g. "Ricotdin <x@gmail.com>"); empty = SMTP_USER.
          SMTP_USER: ${{ secrets.ORG_ADMIN_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.ORG_ADMIN_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.RICOTDIN_MAIL_FROM }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465' # implicit TLS
          # Not secrets: reviewed here. No API_DOCS in production.
          WEB_ORIGIN: https://ricotdin.mmlabs.online
          ALLOWED_ORIGINS: https://ricotdin.mmlabs.online
          RICOTDIN_API_URL: https://ricotdin-api.mmlabs.online
          # FORWARDED_ALLOW_IPS is deliberately unset: cloudflared has no fixed address yet, and
          # trusting the whole `web` subnet would let any container there forge X-Forwarded-For.
          # Unset, uvicorn ignores the header (all clients share cloudflared's address for rate limits).
        run: |
          set -f # the `?` markers below are not globs
          umask 077
          if [[ "$RICOTDIN_ENV_DIR" != "$HOME/"* ]]; then
            echo "::error::RICOTDIN_ENV_DIR $RICOTDIN_ENV_DIR is not under $HOME. Nothing was started."
            exit 1
          fi
          # NAME = required, NAME? = optional.
          api_keys="DATABASE_URL_APP DATABASE_URL_SERVICE DATABASE_URL_WORKER JWT_PRIVATE_KEY JWT_PREVIOUS_PUBLIC_KEY? KEY_ENCRYPTION_SECRET SENTRY_DSN? SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD MAIL_FROM? WEB_ORIGIN ALLOWED_ORIGINS"
          worker_keys="DATABASE_URL_WORKER KEY_ENCRYPTION_SECRET SENTRY_DSN?"
          web_keys="RICOTDIN_API_URL"
          # Gmail shows App Passwords in groups of four: drop the spaces, as deploy-org-admin-api does.
          SMTP_PASSWORD="${SMTP_PASSWORD// /}"
          # Secret name to report for a key (SMTP comes from the org-admin-api environment).
          secret_name() {
            case "$1" in
              SMTP_USER) echo "ORG_ADMIN_SMTP_USERNAME(env org-admin-api)" ;;
              SMTP_PASSWORD) echo "ORG_ADMIN_SMTP_PASSWORD(env org-admin-api)" ;;
              *) echo "RICOTDIN_$1" ;;
            esac
          }
          missing=""
          bad=""
          add_once() { case " $1 " in *" $2 "*) echo "$1" ;; *) echo "$1 $2" ;; esac; }
          write_env() { # $1 = output file, then the key specs
            local out="$1" spec name value
            shift
            : > "$out"
            for spec in "$@"; do
              name="${spec%\?}"
              value="${!name}"
              if [ -z "$value" ]; then
                if [ "$name" = "$spec" ]; then missing="$(add_once "$missing" "$(secret_name "$name")")"; fi
                continue
              fi
              case "$value" in
                *"'"* | *$'\n'* | *$'\r'*) bad="$(add_once "$bad" "$(secret_name "$name")")"; continue ;;
              esac
              printf "%s='%s'\n" "$name" "$value" >> "$out"
            done
          }
          install -d -m 700 "$RICOTDIN_ENV_DIR"
          tmps=""
          trap 'rm -f $tmps' EXIT
          for svc in api worker web; do
            tmp="$(mktemp "$RICOTDIN_ENV_DIR/.$svc.env.XXXXXX")"
            tmps="$tmps $tmp"
            case "$svc" in
              api) write_env "$tmp" $api_keys ;;
              worker) write_env "$tmp" $worker_keys ;;
              web) write_env "$tmp" $web_keys ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. Set RICOTDIN_* with gh secret set <NAME> -R mmlabs-online/deployment (ORG_ADMIN_SMTP_* add --env org-admin-api), then Run workflow. Nothing was started."
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::Secret(s)$bad hold a quote or a line break (JWT_PRIVATE_KEY must be one line with escaped \\n). Nothing was started."
            exit 1
          fi
          set -- $tmps
          for svc in api worker web; do
            chmod 600 "$1"
            mv -f "$1" "$RICOTDIN_ENV_DIR/$svc.env"
            shift
          done
          trap - EXIT

      - name: deploy
        id: deploy
        if: steps.release.outputs.skip != 'true'
        run: |
          compose=(docker compose -p "$PROJECT" -f "$APP_DIR/compose.yml" --env-file "$APP_DIR/release.env")
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --wait --wait-timeout 180

      - name: rollback
        id: rollback
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          BEFORE: ${{ github.event.before }}
          FAILED: ${{ steps.release.outputs.image }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error::$FAILED failed its health check and there is no previous release to restore. Nothing was pushed."
            echo "result=no-previous" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git restore --source="$BEFORE" --staged --worktree -- "$APP_DIR"
          # release.env holds the three pins and comments, nothing else (compose --env-file would
          # honour any other key, e.g. COMPOSE_*). Both images: same tag, by digest, v2 repos only.
          check_release_env() {
            local file="$1" version api webimg pair name value pattern
            if grep -vqE '^(#.*|RICOTDIN_API_IMAGE=.*|RICOTDIN_WEB_IMAGE=.*|RICOTDIN_VERSION=v[2-9][0-9]*\.[0-9]+\.[0-9]+|)$' "$file"; then
              echo "::error::$file holds a line other than the three pins. Nothing was restored."
              return 1
            fi
            version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$file")"
            api="$(sed -n 's/^RICOTDIN_API_IMAGE=//p' "$file")"
            webimg="$(sed -n 's/^RICOTDIN_WEB_IMAGE=//p' "$file")"
            for pair in "api:$api" "web:$webimg"; do
              name="${pair%%:*}"; value="${pair#*:}"
              pattern="^mingming21400/ricotdin-$name:v[2-9][0-9]*\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$"
              if [ -z "$version" ] || ! [[ "$value" =~ $pattern ]] || [[ "$value" != "mingming21400/ricotdin-$name:$version@sha256:"* ]]; then
                echo "::error::The $name pin in $file is not mingming21400/ricotdin-$name:$version@sha256:<digest>. Nothing was restored."
                return 1
              fi
            done
          }
          if ! check_release_env "$APP_DIR/release.env"; then
            echo "result=restore-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          compose=(docker compose -p "$PROJECT" -f "$APP_DIR/compose.yml" --env-file "$APP_DIR/release.env")
          if ! "${compose[@]}" pull || ! "${compose[@]}" up -d --wait --wait-timeout 180; then
            echo "::error::$FAILED failed its health check, and restoring $PREVIOUS failed too. Nothing was pushed."
            echo "result=restore-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          failed_version="$FAILED"; previous_version="$PREVIOUS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore ricotdin v2 ${previous_version}: ${failed_version} failed its health check"
          if ! git push origin HEAD:main; then
            echo "::error::Restored $PREVIOUS on the server, but the revert could not be pushed to main. The repository and the server disagree until it is."
            echo "result=restore-unpushed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=restored" >> "$GITHUB_OUTPUT"
          echo "::error::$FAILED failed its health check. Restored $PREVIOUS and pushed the revert."
          exit 1

      - name: notify
        if: always() && steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVFILE: ${{ steps.envfile.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          RESULT: ${{ steps.rollback.outputs.result }}
          IMAGE: ${{ steps.release.outputs.image }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ENVFILE" = "failure" ]; then
            msg="env-missing: a RICOTDIN_* or ORG_ADMIN_SMTP_* secret is missing or malformed (names in the run log); nothing was started (main still pins \`$IMAGE\`). Set it, then Actions → deploy-ricotdin-v2 → Run workflow."
          else
          case "$DEPLOY:$RESULT" in
            success:)                  msg="deployed: \`$IMAGE\` is running and healthy." ;;
            failure:restored)          msg="restored: \`$IMAGE\` failed its health check; \`$PREVIOUS\` is running again and the revert is on main." ;;
            failure:restore-unpushed)  msg="restored, revert NOT pushed: \`$PREVIOUS\` is running, but main still pins \`$IMAGE\`." ;;
            failure:no-previous)       msg="no-previous: \`$IMAGE\` failed its health check and there was no earlier release to restore." ;;
            failure:restore-failed)    msg="restore-failed: \`$IMAGE\` failed its health check and so did \`$PREVIOUS\`. ricotdin v2 needs a hand." ;;
            *)                         msg="did-not-complete: the deploy did not run to the end (deploy: ${DEPLOY:-not run}, restore: ${RESULT:-not run})." ;;
          esac
          fi
          {
            echo "### deploy-ricotdin-v2"
            echo ""
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "deploy-ricotdin-v2 — $msg Run: $RUN_URL"
          fi
