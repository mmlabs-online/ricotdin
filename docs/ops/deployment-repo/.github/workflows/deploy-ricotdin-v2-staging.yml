name: deploy-ricotdin-v2-staging

# DRAFT for the deployment repository, kept in ricotdin/docs/ops/deployment-repo/ (OPS-02); copied
# by the operator. A copy of deploy-ricotdin-v2.yml for STAGING: a merge to main that touches
# apps/ricotdin-v2-staging/ deploys ricotdin v2 staging (api + worker + web + its own autoheal) on
# the self-hosted runner macbook-runner (mmlabs-server is retired): pull both images pinned in release.env, start them, wait
# until every container is healthy. If not, restore apps/ricotdin-v2-staging/ as it was before the
# push, redeploy that, and push the revert. workflow_dispatch redeploys what main pins.
# Production (apps/ricotdin-v2/) and v1 (apps/ricotdin/) are untouched by this workflow.
#
# The release PRs come from ricotdin's release-staging.yml (branch release/ricotdin-v2-staging-vX.Y.Z,
# merged by that run once pr-scope passes). Runtime secrets live ONLY in the three server env files below.
# No migrate step: staging uses the Neon dev branch; the owner runs alembic before pushing a
# staging branch that brings a migration.

on:
  push:
    branches: [main]
    paths: ['apps/ricotdin-v2-staging/**']
  workflow_dispatch:

permissions:
  contents: write # the revert push after a restore
  pull-requests: write # the outcome comment on the merged release PR

concurrency:
  group: deploy-ricotdin-v2-staging
  cancel-in-progress: false

env:
  APP_DIR: apps/ricotdin-v2-staging
  PROJECT: ricotdin-v2-staging
  # Must match env_file in apps/ricotdin-v2-staging/compose.yml. chmod 600, owned by the runner user.
  RICOTDIN_ENV_FILES: /Users/mingming/.config/ricotdin-staging/api.env /Users/mingming/.config/ricotdin-staging/worker.env /Users/mingming/.config/ricotdin-staging/web.env

jobs:
  deploy:
    runs-on: [self-hosted, macbook-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: release
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if grep -n 'TODO-operator' "$APP_DIR/compose.yml"; then
            echo "::error::$APP_DIR/compose.yml still holds a TODO-operator placeholder. Replace it before deploying. Nothing was started."
            exit 1
          fi
          if [ ! -f "$APP_DIR/release.env" ]; then
            echo "::notice::No $APP_DIR/release.env yet: nothing has been released. Nothing was deployed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # release.env holds the three pins and comments, nothing else (compose --env-file would
          # honour any other key, e.g. COMPOSE_*). Both images: same tag, by digest, v2 repos only.
          check_release_env() {
            local file="$1" version api webimg pair name value pattern
            if grep -vqE '^(#.*|RICOTDIN_API_IMAGE=.*|RICOTDIN_WEB_IMAGE=.*|RICOTDIN_VERSION=staging-[1-9][0-9]*\.[0-9]+\.[0-9]+-[0-9a-f]{7}|)$' "$file"; then
              echo "::error::$file holds a line other than the three pins. Nothing was started."
              return 1
            fi
            version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$file")"
            api="$(sed -n 's/^RICOTDIN_API_IMAGE=//p' "$file")"
            webimg="$(sed -n 's/^RICOTDIN_WEB_IMAGE=//p' "$file")"
            for pair in "api:$api" "web:$webimg"; do
              name="${pair%%:*}"; value="${pair#*:}"
              pattern="^mingming21400/ricotdin-$name:staging-[1-9][0-9]*\.[0-9]+\.[0-9]+-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
              if [ -z "$version" ] || ! [[ "$value" =~ $pattern ]] || [[ "$value" != "mingming21400/ricotdin-$name:$version@sha256:"* ]]; then
                echo "::error::The $name pin in $file is not mingming21400/ricotdin-$name:$version@sha256:<digest>. Nothing was started."
                return 1
              fi
            done
          }
          check_release_env "$APP_DIR/release.env"
          version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$APP_DIR/release.env")"
          image="$version"
          previous=""
          # BEFORE is empty on workflow_dispatch: no previous release, so a failure is not restored.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE:$APP_DIR/release.env" 2>/dev/null; then
            previous="$(git show "$BEFORE:$APP_DIR/release.env" | sed -n 's/^RICOTDIN_VERSION=//p')"
          fi
          {
            echo "skip=false"
            echo "image=$image"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      - name: server env file
        id: envfile
        if: steps.release.outputs.skip != 'true'
        run: |
          # Only the path is ever printed; the file's contents never reach the log.
          for f in $RICOTDIN_ENV_FILES; do
            if [ ! -f "$f" ] || [ ! -r "$f" ]; then
              echo "::error::Server env file $f is missing or not readable by the runner. Create it (see docs/ops/deployment-repo/README.md in ricotdin). Nothing was started."
              exit 1
            fi
          done

      - name: deploy
        id: deploy
        if: steps.release.outputs.skip != 'true'
        run: |
          compose=(docker compose -p "$PROJECT" -f "$APP_DIR/compose.yml" --env-file "$APP_DIR/release.env")
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --wait --wait-timeout 180

      - name: rollback
        id: rollback
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          BEFORE: ${{ github.event.before }}
          FAILED: ${{ steps.release.outputs.image }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error::$FAILED failed its health check and there is no previous release to restore. Nothing was pushed."
            echo "result=no-previous" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git restore --source="$BEFORE" --staged --worktree -- "$APP_DIR"
          # release.env holds the three pins and comments, nothing else (compose --env-file would
          # honour any other key, e.g. COMPOSE_*). Both images: same tag, by digest, v2 repos only.
          check_release_env() {
            local file="$1" version api webimg pair name value pattern
            if grep -vqE '^(#.*|RICOTDIN_API_IMAGE=.*|RICOTDIN_WEB_IMAGE=.*|RICOTDIN_VERSION=staging-[1-9][0-9]*\.[0-9]+\.[0-9]+-[0-9a-f]{7}|)$' "$file"; then
              echo "::error::$file holds a line other than the three pins. Nothing was restored."
              return 1
            fi
            version="$(sed -n 's/^RICOTDIN_VERSION=//p' "$file")"
            api="$(sed -n 's/^RICOTDIN_API_IMAGE=//p' "$file")"
            webimg="$(sed -n 's/^RICOTDIN_WEB_IMAGE=//p' "$file")"
            for pair in "api:$api" "web:$webimg"; do
              name="${pair%%:*}"; value="${pair#*:}"
              pattern="^mingming21400/ricotdin-$name:staging-[1-9][0-9]*\.[0-9]+\.[0-9]+-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
              if [ -z "$version" ] || ! [[ "$value" =~ $pattern ]] || [[ "$value" != "mingming21400/ricotdin-$name:$version@sha256:"* ]]; then
                echo "::error::The $name pin in $file is not mingming21400/ricotdin-$name:$version@sha256:<digest>. Nothing was restored."
                return 1
              fi
            done
          }
          if ! check_release_env "$APP_DIR/release.env"; then
            echo "result=restore-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          compose=(docker compose -p "$PROJECT" -f "$APP_DIR/compose.yml" --env-file "$APP_DIR/release.env")
          if ! "${compose[@]}" pull || ! "${compose[@]}" up -d --wait --wait-timeout 180; then
            echo "::error::$FAILED failed its health check, and restoring $PREVIOUS failed too. Nothing was pushed."
            echo "result=restore-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          failed_version="$FAILED"; previous_version="$PREVIOUS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore ricotdin v2 staging ${previous_version}: ${failed_version} failed its health check"
          if ! git push origin HEAD:main; then
            echo "::error::Restored $PREVIOUS on the server, but the revert could not be pushed to main. The repository and the server disagree until it is."
            echo "result=restore-unpushed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=restored" >> "$GITHUB_OUTPUT"
          echo "::error::$FAILED failed its health check. Restored $PREVIOUS and pushed the revert."
          exit 1

      - name: notify
        if: always() && steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVFILE: ${{ steps.envfile.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          RESULT: ${{ steps.rollback.outputs.result }}
          IMAGE: ${{ steps.release.outputs.image }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ENVFILE" = "failure" ]; then
            msg="env-missing: a server env file ($RICOTDIN_ENV_FILES) is missing or unreadable; nothing was started (main still pins \`$IMAGE\`). Create it, then Actions → deploy-ricotdin-v2-staging → Run workflow."
          else
          case "$DEPLOY:$RESULT" in
            success:)                  msg="deployed: \`$IMAGE\` is running and healthy." ;;
            failure:restored)          msg="restored: \`$IMAGE\` failed its health check; \`$PREVIOUS\` is running again and the revert is on main." ;;
            failure:restore-unpushed)  msg="restored, revert NOT pushed: \`$PREVIOUS\` is running, but main still pins \`$IMAGE\`." ;;
            failure:no-previous)       msg="no-previous: \`$IMAGE\` failed its health check and there was no earlier release to restore." ;;
            failure:restore-failed)    msg="restore-failed: \`$IMAGE\` failed its health check and so did \`$PREVIOUS\`. ricotdin v2 staging needs a hand." ;;
            *)                         msg="did-not-complete: the deploy did not run to the end (deploy: ${DEPLOY:-not run}, restore: ${RESULT:-not run})." ;;
          esac
          fi
          {
            echo "### deploy-ricotdin-v2-staging"
            echo ""
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "deploy-ricotdin-v2-staging — $msg Run: $RUN_URL"
          fi
