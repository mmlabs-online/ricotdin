name: CI (api)

# v2 backend (FastAPI) in app/api — ARC-00 onward.
on:
  push:
    branches: [main, dev, 'release/**']
    # legacy schema/migrations feed the v1↔v2 parity test (ARC-02).
    paths: ['app/api/**', 'legacy/schema.sql', 'legacy/migrations/**', '.github/workflows/ci-api.yml']
  pull_request:
    branches: [main, dev, 'release/**']
    paths: ['app/api/**', 'legacy/schema.sql', 'legacy/migrations/**', '.github/workflows/ci-api.yml']

permissions:
  contents: read

jobs:
  api:
    name: ruff · mypy · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api

    # Disposable Postgres + pgvector for the *_integration tests (no secrets involved).
    services:
      postgres:
        image: pgvector/pgvector:pg18  # same major as Neon (baseline generated on PG 18)
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: app/api/uv.lock

      - name: Install (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q
