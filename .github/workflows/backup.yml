# ARC-15 (was OPS-03) — daily encrypted backup of the v2 Neon database → dedicated R2 bucket
# (30-day retention).
#
# pg_dump -Fc (schema + data + grants; roles are recreated by migrations + scripts.provision_db_roles)
# → age-encrypt with the PUBLIC key → upload → prune. The workflow never holds a key that can
# decrypt a backup, and no plaintext dump leaves the runner. Restore runbook + one-time setup:
# docs/ops/backup-restore.md. v1 (Supabase) is no longer backed up here: its final dump is taken by
# hand at the cutover (docs/ops/v2-cutover.md); Supabase stays untouched until ARC-16.
#
# Secrets live in the GitHub Environment `backup` (deployment branches: main + dev — `schedule`
# runs from the default branch `dev`):
#   NEON_BACKUP_DATABASE_URL      DIRECT (not -pooler) URL of the Neon `main` branch, sslmode=require;
#                                 a login that can read everything (pg_read_all_data), never the
#                                 app/service/worker logins
#   AGE_RECIPIENT                 age public key (age1…); the private key stays offline
#   R2_BACKUP_ACCOUNT_ID, R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET
#                                 token scoped to the backup bucket only (Object Read & Write)
#
# Supply-chain ordering: the dump + encryption run BEFORE any Python package is installed, so
# package code only ever sees the R2 token. Actions are pinned by commit SHA.

name: db-backup

on:
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pg_dump must be at least the server's major version (Neon: Postgres 18).
      - name: Install pg_dump 18 and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          age --version

      - name: Check secrets are set
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          missing=0
          for v in NEON_BACKUP_DATABASE_URL AGE_RECIPIENT R2_BACKUP_ACCOUNT_ID R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY R2_BACKUP_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          case "$AGE_RECIPIENT" in age1*) ;; *) echo "::error::AGE_RECIPIENT must be an age public key (age1…)"; missing=1 ;; esac
          case "$NEON_BACKUP_DATABASE_URL" in *-pooler.*) echo "::error::use the direct (not -pooler) Neon URL"; missing=1 ;; esac
          exit $missing

      - name: Dump and encrypt
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          # GitHub masks the whole URL secret, not the password on its own (or URL-decoded).
          python3 - <<'PY'
          import os, urllib.parse
          pw = urllib.parse.urlsplit(os.environ["NEON_BACKUP_DATABASE_URL"]).password or ""
          for v in {pw, urllib.parse.unquote(pw)}:
              if v:
                  print(f"::add-mask::{v}")
          PY
          out="$RUNNER_TEMP/backup.dump"
          # (libpq takes a URL only as --dbname; the runner is single-use and the secret masked)
          /usr/lib/postgresql/18/bin/pg_dump --dbname="$NEON_BACKUP_DATABASE_URL" \
            --format=custom --compress=6 --no-password --file="$out"
          test -s "$out" || { echo "::error::the dump is empty"; exit 1; }
          # A readable archive with the tables we expect, before it is encrypted and sent.
          /usr/lib/postgresql/18/bin/pg_restore --list "$out" | grep -q 'TABLE DATA public meetings' \
            || { echo "::error::the dump has no public.meetings data"; exit 1; }
          age -r "$AGE_RECIPIENT" -o "$out.age" "$out"
          rm -f "$out"
          ls -l "$out.age"

      # Python packages are installed only now: the DB URL and the plaintext dump are already gone.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.17'

      - name: Upload to R2
        working-directory: app/api
        env:
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: uv run --frozen --no-dev python -m scripts.backup_r2 upload "$RUNNER_TEMP/backup.dump.age"

      # Runs only when every step above succeeded (default `if: success()`).
      - name: Prune backups older than 30 days
        working-directory: app/api
        env:
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          BACKUP_RETENTION_DAYS: '30'
        run: uv run --frozen --no-dev python -m scripts.backup_r2 prune

      - name: Remove local files
        if: always()
        run: rm -f "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/backup.dump.age"
