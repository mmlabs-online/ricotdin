# OPS-03 — daily encrypted Supabase DB backup → dedicated R2 bucket (30-day retention).
#
# dump (roles, schema, data) → tar.gz → age-encrypt with the PUBLIC key → upload → prune.
# The workflow never holds a key that can decrypt a backup, and no plaintext dump leaves
# the runner. Restore runbook + one-time setup: docs/ops/backup-restore.md.
#
# Secrets live in the GitHub Environment `backup`. Its deployment branches must be main + dev
# (`schedule` runs from the default branch `dev`) so a workflow on any other branch cannot read
# them — not yet configured as of 2026-10-25 (BUG-018):
#   SUPABASE_DB_URL               Session pooler connection string (IPv4; runners have no IPv6)
#   AGE_RECIPIENT                 age public key (age1…); the private key stays offline
#   R2_BACKUP_ACCOUNT_ID, R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET
#                                 token scoped to the backup bucket only (Object Read & Write)
#
# Supply-chain ordering: the DB dump + encryption run BEFORE any npm code is installed, and
# `npm ci --ignore-scripts` runs no install scripts. npm code only ever sees the R2 token.
# Third-party actions are pinned by commit SHA; the Supabase CLI by exact version.
# Note: `schedule` only runs from the default branch (dev).

name: db-backup

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          supabase --version
          age --version

      - name: Check secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          missing=0
          for v in SUPABASE_DB_URL AGE_RECIPIENT R2_BACKUP_ACCOUNT_ID R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY R2_BACKUP_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          case "$AGE_RECIPIENT" in age1*) ;; *) echo "::error::AGE_RECIPIENT must be an age public key (age1…)"; missing=1 ;; esac
          exit $missing

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          # GitHub masks the whole URL secret, not the password on its own (or URL-decoded).
          python3 - <<'PY'
          import os, urllib.parse
          pw = urllib.parse.urlsplit(os.environ["SUPABASE_DB_URL"]).password or ""
          for v in {pw, urllib.parse.unquote(pw)}:
              if v:
                  print(f"::add-mask::{v}")
          PY
          dump="$RUNNER_TEMP/dump"
          mkdir -p "$dump"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$dump/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$dump/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$dump/data.sql" --use-copy --data-only
          for f in roles.sql schema.sql data.sql; do
            test -s "$dump/$f" || { echo "::error::$f is empty"; exit 1; }
          done
          tar -C "$dump" -czf "$RUNNER_TEMP/backup.tar.gz" roles.sql schema.sql data.sql
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/backup.tar.gz.age" "$RUNNER_TEMP/backup.tar.gz"
          rm -rf "$dump" "$RUNNER_TEMP/backup.tar.gz"
          ls -l "$RUNNER_TEMP/backup.tar.gz.age"

      # npm code is installed only now: the DB URL and the plaintext dump are already gone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy/package-lock.json

      - name: Install dependencies (no install scripts)
        working-directory: legacy
        run: npm ci --ignore-scripts

      - name: Upload to R2
        env:
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        working-directory: legacy
        run: npx tsx scripts/backup/r2.ts upload "$RUNNER_TEMP/backup.tar.gz.age"

      # Runs only when every step above succeeded (default `if: success()`).
      - name: Prune backups older than 30 days
        env:
          R2_BACKUP_ACCOUNT_ID: ${{ secrets.R2_BACKUP_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          BACKUP_RETENTION_DAYS: '30'
        working-directory: legacy
        run: npx tsx scripts/backup/r2.ts prune

      - name: Remove local files
        if: always()
        run: rm -rf "$RUNNER_TEMP/dump" "$RUNNER_TEMP/backup.tar.gz" "$RUNNER_TEMP/backup.tar.gz.age"
