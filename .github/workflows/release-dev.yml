name: Build & Push (dev)

# Mỗi lần push code lên nhánh dev -> build image mới, push lên Docker Hub.
on:
  push:
    branches: [dev]
    # ARC-00: only when the v1 image content changes (legacy/ + the runtime prompt).
    paths:
      - 'legacy/**'
      - 'ai-instruction/ai-gen/**'
      - '.dockerignore'
      - '.github/workflows/release-dev.yml'

permissions:
  contents: read

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Tạo tag: 'dev' (di động) + 'dev-<run_number>-<sha ngắn>' (cố định mỗi lần build)
      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=dev-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: legacy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:${{ steps.meta.outputs.version }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Cache layer giữa các lần build cho nhanh
          cache-from: type=gha
          cache-to: type=gha,mode=max
