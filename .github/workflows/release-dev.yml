name: Build & Push (dev)

# Mỗi lần push code lên nhánh dev -> build image mới, push lên Docker Hub.
on:
  push:
    branches: [dev]
    # ARC-00: only when the v1 image content changes (legacy/ + the runtime prompt).
    paths:
      - 'legacy/**'
      - 'ai-instruction/ai-gen/**'
      - '.dockerignore'
      - '.github/workflows/release-dev.yml'

permissions:
  contents: read

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tạo tag: 'dev' (di động) + 'dev-<run_number>-<sha ngắn>' (cố định mỗi lần build)
      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=dev-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: legacy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/ricotdin:${{ steps.meta.outputs.version }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Cache layer giữa các lần build cho nhanh
          cache-from: type=gha
          cache-to: type=gha,mode=max
