name: Release staging

# OPS-02. Push a branch staging/X.Y.Z (X >= 2, cut from dev) → staging at
# https://ricotdin-staging.mmlabs.online (API: ricotdin-staging-api.mmlabs.online):
#   1. guard: branch name ↔ app/api/pyproject.toml ↔ app/web/package.json (app.ops.staging_release);
#   2. the full API and web CI (ci-api.yml, ci-web.yml, reused as-is);
#   3. build + push mingming21400/ricotdin-api and ricotdin-web as :staging-X.Y.Z-<sha7>
#      (never latest, never a production vX.Y.Z tag);
#   4. open or update PR "ricotdin staging-X.Y.Z-<sha7>" on mmlabs-online/deployment that changes
#      ONLY apps/ricotdin-v2-staging/release.env (both images by digest); its branch
#      release/ricotdin-v2-staging-vX.Y.Z makes pr-scope.yml limit it to that folder;
#   5. wait for pr-scope to pass, check the PR still changes only that file, merge it.
#      Not GitHub auto-merge: on the Free plan a private repo has no branch protection, so
#      auto-merge would merge at once without waiting for pr-scope (OPS-02 review).
# The deployment repo's deploy-ricotdin-v2-staging.yml then deploys it on the macbook-runner. Every
# push to the branch redeploys. No migration step: run `alembic upgrade head` on the staging
# database (the Neon dev branch) before pushing a commit that brings a migration.
on:
  push:
    branches: ['staging/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail (the implicit shell has no pipefail)

concurrency:
  group: release-staging-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same branch wins

env:
  API_IMAGE: mingming21400/ricotdin-api
  WEB_IMAGE: mingming21400/ricotdin-web
  DEPLOY_REPO: mmlabs-online/deployment
  APP_DIR: apps/ricotdin-v2-staging

jobs:
  guard:
    name: branch · version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Standard library only: nothing is installed before the checks pass.
      - name: Check the branch and the versions
        id: check
        working-directory: app/api
        # A file, not -m: -I implies -P since Python 3.11. It appends the outputs itself, only on success.
        run: python3 -I app/ops/staging_release.py

  verify-api:
    needs: guard
    uses: ./.github/workflows/ci-api.yml

  verify-web:
    needs: guard
    uses: ./.github/workflows/ci-web.yml

  build:
    name: build & push images · open staging deployment PR
    needs: [guard, verify-api, verify-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag is never baked in: the API reads RICOTDIN_VERSION from release.env at runtime.
      - name: Build & push API image (API + worker)
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ needs.guard.outputs.tag }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Build & push web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/web
          file: app/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ needs.guard.outputs.tag }}
          cache-from: type=gha,scope=web-staging
          cache-to: type=gha,mode=max,scope=web-staging

      # DEPLOY_REPO_TOKEN: fine-grained PAT on mmlabs-online/deployment only, Contents + Pull
      # requests read/write.
      - name: Open staging deployment PR and merge it after pr-scope
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
          BRANCH: ${{ needs.guard.outputs.branch }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          # A re-run of an older run must not roll staging back to its commit.
          HEAD_SHA="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME has moved on to $HEAD_SHA: not deploying the older $GITHUB_SHA."
            exit 0
          fi
          # Validates both digests and the tag before anything is written.
          ENV_TEXT="$(cd app/api && python3 -I app/ops/staging_release.py release-env "$TAG" "$API_DIGEST" "$WEB_DIGEST")"

          gh auth setup-git
          gh repo clone "$DEPLOY_REPO" deployment -- --depth 1
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "$APP_DIR"
          printf '%s\n' "$ENV_TEXT" > "$APP_DIR/release.env"
          git add "$APP_DIR/release.env"
          if git diff --cached --quiet; then
            echo "$APP_DIR/release.env already pins $TAG on main — nothing to deploy."
            exit 0
          fi
          git commit -m "ricotdin $TAG"
          # --force: the branch is per version; each push to staging/X.Y.Z rewrites it.
          git push --force -u origin "$BRANCH"

          PR="$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "ricotdin $TAG"
            echo "Open PR $PR updated to $TAG."
          else
            PR="$(gh pr create --title "ricotdin $TAG" --head "$BRANCH" \
              --body "Staging deploy of \`$API_IMAGE:$TAG@$API_DIGEST\` (API + worker) and \`$WEB_IMAGE:$TAG@$WEB_DIGEST\` (commit $GITHUB_SHA, branch $GITHUB_REF_NAME). Changes only \`$APP_DIR/release.env\`; merged by that run once pr-scope passes. Written by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")"
          fi

          # Right after a force-push the PR may still report the old head and its old checks.
          for _ in $(seq 20); do
            [ "$(gh pr view "$PR" --json headRefOid -q .headRefOid)" = "$(git rev-parse HEAD)" ] && break
            sleep 3
          done
          # The PR must change exactly that one file (the deploy runs compose.yml unchecked).
          FILES="$(gh pr diff "$PR" --name-only)"
          if [ "$FILES" != "$APP_DIR/release.env" ]; then
            echo "::error::$PR changes more than $APP_DIR/release.env. Not merging:"
            echo "$FILES"
            exit 1
          fi
          # Wait for pr-scope (at most 10 min), then merge exactly the commit that was checked.
          # Read through the Actions API (DEPLOY_REPO_TOKEN needs Actions: read). `gh pr checks`
          # needs the check-status rollup, which a fine-grained PAT cannot read (first staging run).
          HEAD="$(git rev-parse HEAD)"
          STATE=""
          for _ in $(seq 40); do
            if ! RUNS="$(gh run list -R "$DEPLOY_REPO" --workflow pr-scope.yml --commit "$HEAD" --event pull_request --json status,conclusion -q 'map(select(.status == "completed")) | .[0].conclusion // ""')"; then
              echo "::error::Cannot read pr-scope runs on $DEPLOY_REPO: DEPLOY_REPO_TOKEN needs Actions: read."
              exit 1
            fi
            case "$RUNS" in
              success) STATE=pass; break ;;
              "") ;;
              *) echo "::error::pr-scope ended '$RUNS' on $PR. Not merging."; exit 1 ;;
            esac
            sleep 15
          done
          if [ "$STATE" != pass ]; then
            echo "::error::pr-scope did not finish on $PR within 10 minutes. Merge it by hand once it passes."
            exit 1
          fi
          gh pr merge "$PR" --squash --match-head-commit "$HEAD"
