name: Secrets scan

# gitleaks (ARC-15) on every PR and push: the checked-out tree, plus each new commit (a secret
# added and removed again inside a PR still sits in history). Older history is not rescanned:
# findings there are handled by rotating the secret, never by an allowlist (.gitleaks.toml).
on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.0
  GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e # linux_x64 tarball

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary, checksum-verified (gitleaks-action needs a licence for organisation repos).
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .

      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before", and a force push leaves it unreachable: scan everything
          # since the branch left dev instead (never only the tip: a secret added and removed
          # again in earlier commits would be missed).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/dev "$HEAD" 2>/dev/null || true)"
          fi
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD"; else RANGE="$HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="$RANGE" .
