name: Release

# v2 (ARC-15). Two ways in:
#   - push to a release branch release/X.Y (cut from main, or a hotfix merged into it): the guard
#     reads the version from app/api/pyproject.toml + app/web/package.json and, when tag
#     v<version> does not exist yet, creates and pushes it, then releases it. When the tag exists
#     already (a push without a version bump) nothing is released;
#   - push a tag vX.Y.Z by hand on release/X.Y (as before).
# A tag pushed by this workflow (GITHUB_TOKEN) does not start it again, so a version runs once.
# Then:
#   1. guard: tag on release/X.Y, same version in app/api/pyproject.toml and app/web/package.json;
#   2. the full API and web CI (ci-api.yml, ci-web.yml, reused as-is);
#   3. build + push mingming21400/ricotdin-api:vX.Y.Z (API and worker share it) and
#      mingming21400/ricotdin-web:vX.Y.Z (+ latest when it is the highest version);
#   4. open PR "ricotdin vX.Y.Z" on mmlabs-online/deployment pinning BOTH images by digest in
#      apps/ricotdin-v2/release.env (the only ricotdin deployment: v1 and staging are retired,
#      ARC-20). A prerelease tag (vX.Y.Z-rc1) only builds and pushes the images: no deployment PR.
# Deploy = run the release's `alembic upgrade head` on the Mac, then review + merge that PR
# (docs/ops/go-live.md).
on:
  push:
    branches: ['release/[0-9]+.[0-9]+'] # release/X.Y only (not release/1.1-style v1 or release/2.0.0)
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

# One release run per branch/tag at a time; never cancel one half-way (images + deployment PR).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: ricotdin
  API_IMAGE: mingming21400/ricotdin-api
  WEB_IMAGE: mingming21400/ricotdin-web
  DEPLOY_REPO: mmlabs-online/deployment

jobs:
  guard:
    name: tag · branch · version
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag on a release-branch push
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branch check needs the history

      # Branch push: the tag comes from the version files (created below if it is new).
      # Tag push: the tag is the ref itself.
      - name: Decide the tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          API_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/api/pyproject.toml | head -1)"
          WEB_VERSION="$(node -p "require('./app/web/package.json').version")"
          if [ "$API_VERSION" != "$WEB_VERSION" ]; then
            echo "::error::app/api/pyproject.toml has $API_VERSION but app/web/package.json has $WEB_VERSION"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$API_VERSION"
            LINE="${GITHUB_REF_NAME#release/}"
            case "$API_VERSION" in
              "$LINE".*) ;;
              *) echo "::error::Branch $GITHUB_REF_NAME has version $API_VERSION: it must be $LINE.<patch>"; exit 1 ;;
            esac
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::notice::$TAG exists already: nothing to release. Bump both version files to release a new one."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          TAG_VERSION="${TAG#v}"
          MAJOR="${TAG_VERSION%%.*}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || [ "$MAJOR" -lt 2 ]; then
            echo "::error::$TAG is not a v2+ version tag: v1 is retired (ARC-20), only v2+ is released"
            exit 1
          fi
          BRANCH="release/$(echo "$TAG_VERSION" | cut -d. -f1,2)"
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qx "  origin/$BRANCH"; then
            echo "::error::$TAG must be on branch $BRANCH"
            exit 1
          fi
          if [ "$API_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Both version files say $API_VERSION, tag is $TAG"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: github.ref_type == 'branch' && steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "::notice::Tagged $GITHUB_SHA as $TAG"

  verify-api:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    uses: ./.github/workflows/ci-api.yml

  verify-web:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    uses: ./.github/workflows/ci-web.yml

  build:
    name: build & push images · open deployment PR
    needs: [guard, verify-api, verify-web]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag list decides "latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 'vX.Y.Z' is fixed; deploys use the digest, never a tag. 'latest' only for the highest
      # plain vX.Y.Z (a hotfix on an older line or a prerelease never moves it).
      - name: Compute tags
        id: meta
        run: |
          HIGHEST="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          for name in api web; do
            image="$API_IMAGE"; [ "$name" = web ] && image="$WEB_IMAGE"
            {
              echo "$name<<EOF"
              echo "$image:$TAG"
              if [ "$TAG" = "$HIGHEST" ]; then echo "$image:latest"; fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      # The release tag is never baked in (images are promoted by digest): the API reads
      # RICOTDIN_VERSION from release.env at runtime, BUILD_COMMIT is the fallback.
      - name: Build & push API image (API + worker)
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/web
          file: app/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Writes ONLY apps/ricotdin-v2/release.env (the deployment repo's pr-scope.yml must allow
      # it). DEPLOY_REPO_TOKEN: fine-grained PAT on mmlabs-online/deployment only,
      # Contents + Pull requests read/write. The deployment repo must dismiss stale approvals on
      # new commits: a re-run for the same tag force-pushes the release branch.
      - name: Open deployment PR
        if: ${{ !contains(needs.guard.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          # pr-scope.yml reads the app folder from ^release/([a-z0-9-]+)-v[0-9]: "release/ricotdin-v2.0.0"
          # would read as "ricotdin" and fail the scope check, so the branch names ricotdin-v2 (OPS-02).
          BRANCH="release/$APP-v2-$TAG"
          FILE="apps/$APP-v2/release.env"
          if [ -z "$API_DIGEST" ] || [ -z "$WEB_DIGEST" ]; then
            echo "::error::build-push-action returned no digest"
            exit 1
          fi

          gh auth setup-git
          gh repo clone "$DEPLOY_REPO" deployment -- --depth 1
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "apps/$APP-v2" # absent before the first v2 release (OPS-02 review of ARC-15)
          {
            echo "# Written by the $APP release workflow for $TAG (commit $GITHUB_SHA). Do not edit by hand."
            echo "RICOTDIN_API_IMAGE=$API_IMAGE:$TAG@$API_DIGEST"
            echo "RICOTDIN_WEB_IMAGE=$WEB_IMAGE:$TAG@$WEB_DIGEST"
            echo "RICOTDIN_VERSION=$TAG"
          } > "$FILE"

          git add "$FILE"
          # A re-run after the PR was merged: release.env is already right, nothing to commit.
          if git diff --cached --quiet; then
            echo "$FILE is already right for $TAG on the default branch — skipping."
            exit 0
          fi
          git commit -m "$APP $TAG"
          # --force: re-running the workflow for the same tag rewrites the release branch.
          git push --force -u origin "$BRANCH"

          OPEN_PR="$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')"
          if [ -n "$OPEN_PR" ]; then
            echo "Open PR $OPEN_PR — branch updated."
          else
            gh pr create --title "$APP $TAG" --head "$BRANCH" \
              --body "Deploy \`$API_IMAGE:$TAG@$API_DIGEST\` (API + worker) and \`$WEB_IMAGE:$TAG@$WEB_DIGEST\` (commit $GITHUB_SHA). Written by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
