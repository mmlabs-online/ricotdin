name: Release

# v2 (ARC-15, OPS-09). One way in: push a NEW branch release/X.Y.Z (cut from main; a hotfix is a new
# branch release/X.Y.(Z+1) cut from the previous release branch). The version is the branch name:
# no version file to bump, no tag to push by hand.
#   1. guard: tag vX.Y.Z from the branch name (v2+ only); when the tag exists already (a later push
#      to the same branch) nothing is released: cut a new release/X.Y.Z instead;
#   2. the full API and web CI (ci-api.yml, ci-web.yml, reused as-is);
#   3. build + push mingming21400/ricotdin-api:vX.Y.Z (API and worker share it) and
#      mingming21400/ricotdin-web:vX.Y.Z (+ latest when it is the highest version);
#   4. open PR "ricotdin vX.Y.Z" on mmlabs-online/deployment pinning BOTH images by digest in
#      apps/ricotdin-v2/release.env and MERGE it at once (owner decision 2026-11-17): the merge
#      starts deploy-ricotdin-v2 there (pg_dump → alembic upgrade head → replace containers), so
#      pushing the release branch IS the production deploy. Only for the highest plain version: an
#      older line (hotfix after a newer release) gets a PR left open, never an automatic rollback.
#      A prerelease branch (release/X.Y.Z-rc1) only builds and pushes the images.
#   5. the GitHub Release: the version's CHANGELOG.md section, else GitHub's generated notes.
# A tag pushed by this workflow (GITHUB_TOKEN) does not start any workflow, so a version runs once.
on:
  push:
    branches: ['release/[0-9]+.[0-9]+.[0-9]+*'] # release/X.Y.Z[-pre]; old release/X.Y lines never release again

permissions:
  contents: read

# One release run per branch/tag at a time; never cancel one half-way (images + deployment PR).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: ricotdin
  API_IMAGE: mingming21400/ricotdin-api
  WEB_IMAGE: mingming21400/ricotdin-web
  DEPLOY_REPO: mmlabs-online/deployment

jobs:
  guard:
    name: tag from the branch name
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide the tag
        id: tag
        run: |
          TAG="v${GITHUB_REF_NAME#release/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not release/X.Y.Z (or release/X.Y.Z-rc1)"
            exit 1
          fi
          MAJOR="${TAG#v}"; MAJOR="${MAJOR%%.*}"
          if [ "$MAJOR" -lt 2 ]; then
            echo "::error::$TAG: v1 is retired (ARC-20), only v2+ is released"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG exists already: nothing to release. Cut a new branch release/X.Y.Z for a new version."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "::notice::Tagged $GITHUB_SHA as $TAG"

  verify-api:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    uses: ./.github/workflows/ci-api.yml

  verify-web:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    uses: ./.github/workflows/ci-web.yml

  build:
    name: build & push images · deploy (deployment PR, merged)
    needs: [guard, verify-api, verify-web]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag list decides "latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 'vX.Y.Z' is fixed; deploys use the digest, never a tag. 'latest' only for the highest
      # plain vX.Y.Z (a hotfix on an older line or a prerelease never moves it).
      - name: Compute tags
        id: meta
        run: |
          HIGHEST="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          for name in api web; do
            image="$API_IMAGE"; [ "$name" = web ] && image="$WEB_IMAGE"
            {
              echo "$name<<EOF"
              echo "$image:$TAG"
              if [ "$TAG" = "$HIGHEST" ]; then echo "$image:latest"; fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      # The release tag is never baked in (images are promoted by digest): the API reads
      # RICOTDIN_VERSION from release.env at runtime, BUILD_COMMIT is the fallback.
      - name: Build & push API image (API + worker)
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/web
          file: app/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Writes ONLY apps/ricotdin-v2/release.env (the deployment repo's pr-scope.yml must allow
      # it). DEPLOY_REPO_TOKEN: fine-grained PAT on mmlabs-online/deployment only,
      # Contents + Pull requests read/write (also what merging the PR needs). A re-run for the same tag
      # force-pushes the deployment release branch.
      - name: Open and merge the deployment PR (deploys)
        if: ${{ !contains(needs.guard.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          # pr-scope.yml reads the app folder from ^release/([a-z0-9-]+)-v[0-9]: "release/ricotdin-v2.0.0"
          # would read as "ricotdin" and fail the scope check, so the branch names ricotdin-v2 (OPS-02).
          BRANCH="release/$APP-v2-$TAG"
          FILE="apps/$APP-v2/release.env"
          if [ -z "$API_DIGEST" ] || [ -z "$WEB_DIGEST" ]; then
            echo "::error::build-push-action returned no digest"
            exit 1
          fi

          # Deploy automatically only the highest plain version: a hotfix on an older line released after
          # a newer one must never roll production back (and its schema forward-only migrations).
          HIGHEST="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"

          gh auth setup-git
          gh repo clone "$DEPLOY_REPO" deployment -- --depth 1
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "apps/$APP-v2" # absent before the first v2 release (OPS-02 review of ARC-15)
          {
            echo "# Written by the $APP release workflow for $TAG (commit $GITHUB_SHA). Do not edit by hand."
            echo "RICOTDIN_API_IMAGE=$API_IMAGE:$TAG@$API_DIGEST"
            echo "RICOTDIN_WEB_IMAGE=$WEB_IMAGE:$TAG@$WEB_DIGEST"
            echo "RICOTDIN_VERSION=$TAG"
          } > "$FILE"

          git add "$FILE"
          # A re-run after the PR was merged: release.env is already right, nothing to commit.
          if git diff --cached --quiet; then
            echo "$FILE is already right for $TAG on the default branch — skipping."
            exit 0
          fi
          git commit -m "$APP $TAG"
          # --force: re-running the workflow for the same tag rewrites the release branch.
          git push --force -u origin "$BRANCH"

          PR="$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')"
          if [ -n "$PR" ]; then
            echo "Open PR $PR — branch updated."
          else
            PR="$(gh pr create --title "$APP $TAG" --head "$BRANCH" \
              --body "Deploy \`$API_IMAGE:$TAG@$API_DIGEST\` (API + worker) and \`$WEB_IMAGE:$TAG@$WEB_DIGEST\` (commit $GITHUB_SHA). Written by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")"
          fi

          # OPS-09 (owner decision 2026-11-17): merge at once; the merge starts deploy-ricotdin-v2 on the
          # deployment repo (pg_dump → alembic upgrade head → replace containers). A merge by this PAT is a
          # normal push there, so it does start that workflow (a GITHUB_TOKEN push would not).
          if [ "$TAG" != "$HIGHEST" ]; then
            echo "::warning::$TAG is not the highest version ($HIGHEST): PR $PR left open, NOT deployed. Merge it by hand only if you really mean to roll production back."
            exit 0
          fi
          gh pr merge "$PR" --merge --subject "$APP $TAG"
          echo "::notice::Merged $PR: deploy-ricotdin-v2 now deploys $TAG on $DEPLOY_REPO (Actions tab there)."

  github-release:
    needs: [guard, build]
    permissions:
      contents: write # creates the Release
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.guard.outputs.tag }}
