# gitleaks (ARC-15): default rules + allowlist for test data that only LOOKS like a secret.
# CI (secrets-scan.yml) and the pre-commit hook read this file. Never allowlist a real secret:
# rotate it at the provider instead (a leaked value stays in git history).
[extend]
useDefault = true

[allowlist]
description = "Fake keys in tests and fixtures; type annotations"
# Named files only (never a whole directory): a real key pasted into another test still fails.
paths = [
  # fake keys, redaction samples and encrypted v1 crypto fixtures
  '''^app/api/tests/fixtures/v1/crypto_v1\.json$''',
  '''^app/api/tests/test_admin_config_integration\.py$''',
  '''^app/api/tests/test_admin_config_rules\.py$''',
  '''^app/api/tests/test_core_redact\.py$''',
  '''^app/api/tests/test_core_redact_more\.py$''',
  '''^app/api/tests/test_core_sentry\.py$''',
  '''^app/api/tests/test_domain_uploads\.py$''',
  '''^app/web/src/lib/admin/config\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  # dataclass field annotation in app/api/app/auth/jwt.py
  '''private_key: Ed25519PrivateKey''',
]
