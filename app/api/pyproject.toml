[project]
name = "ricotdin-api"
version = "0.0.0"
description = "Ricotdin v2 backend (FastAPI). See ai-instruction/features/feature-Architecture-ARC.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # fixture rows read better on one line

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
